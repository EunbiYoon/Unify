[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

; ✅ Django는 내부 포트 8001로!
[program:django]
directory=/app
command=/opt/venv/bin/gunicorn backend.wsgi:application --bind 127.0.0.1:8001 --workers 2 --timeout 120
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true

; ✅ Streamlit은 내부 8501 + /vision baseUrlPath
[program:streamlit]
directory=/app
; ⚠️ vision/app.py 를 네 실제 엔트리로 수정
command=/opt/venv/bin/streamlit run vision/app.py --server.address=127.0.0.1 --server.port=8501 --server.baseUrlPath=vision --server.enableCORS=false --server.enableXsrfProtection=false
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
