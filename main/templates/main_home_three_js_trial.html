<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Eunbi Dual Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  {% load static %}

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #050816;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
</head>
<body>

<script>
// ==============================
// 기본 세팅
// ==============================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050816);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);
// 방 가운데 약간 뒤에서 두 벽을 동시에 보는 위치
camera.position.set(0, 3, 24);
camera.lookAt(0, 3, 0);

// ==============================
// 조명
// ==============================
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const topLight = new THREE.DirectionalLight(0xffffff, 0.7);
topLight.position.set(0, 18, 10);
topLight.castShadow = true;
scene.add(topLight);

// ==============================
// 바닥 & 천장 (공간감)
// ==============================
const roomWidth = 40;
const roomDepth = 40;

const floorGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x0b0f19,
  roughness: 0.9
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4;
floor.receiveShadow = true;
scene.add(floor);

const ceilGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
const ceilMat = new THREE.MeshStandardMaterial({
  color: 0x050712,
  roughness: 0.9
});
const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 7;
scene.add(ceiling);

// ==============================
// 벽 생성 (좌: SE, 우: ML)
// ==============================
const SE_WALL_COLOR = "#10281e";   // 진한 초록
const ML_WALL_COLOR = "#23112f";   // 진한 보라

function createWall(x, colorHex) {
  const geo = new THREE.PlaneGeometry(24, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: colorHex,
    roughness: 0.85
  });
  const wall = new THREE.Mesh(geo, mat);
  wall.position.set(x, 3, 0);
  // 왼쪽 벽은 카메라를 향해 약간 기울어진 상태
  wall.rotation.y = x < 0 ? Math.PI / 2 : -Math.PI / 2;
  wall.receiveShadow = true;
  scene.add(wall);
  return wall;
}

const seWall = createWall(-14, SE_WALL_COLOR);
const mlWall = createWall(14, ML_WALL_COLOR);

// ==============================
// 라벨(← SOFTWARE ENGINEERING / MACHINE LEARNING →)
// ==============================
function makeLabelTexture(text, alignLeftArrow) {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 256;
  const ctx = c.getContext("2d");

  ctx.fillStyle = "rgba(0,0,0,0)";
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.fillStyle = "#f9fafb";
  ctx.font = "bold 70px system-ui, -apple-system, 'Noto Sans KR'";
  ctx.textBaseline = "middle";
  ctx.textAlign = alignLeftArrow ? "right" : "left";

  const x = alignLeftArrow ? c.width - 60 : 60;
  ctx.fillText(text, x, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function createWallLabel(forLeft) {
  const text = forLeft ? "← SOFTWARE ENGINEERING" : "MACHINE LEARNING →";
  const tex = makeLabelTexture(text, forLeft);
  const geo = new THREE.PlaneGeometry(14, 2);
  const mat = new THREE.MeshStandardMaterial({
    map: tex,
    transparent: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(forLeft ? -14 : 14, 9, 0);
  mesh.rotation.y = forLeft ? Math.PI / 2 : -Math.PI / 2;
  scene.add(mesh);
}

createWallLabel(true);
createWallLabel(false);

// ==============================
// 텍스처 (포스터 스타일)
// ==============================
function createPosterTexture(bgColor, title) {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 512;
  const ctx = c.getContext("2d");

  // 배경 그라디언트
  const grad = ctx.createLinearGradient(0, 0, c.width, c.height);
  grad.addColorStop(0, bgColor);
  grad.addColorStop(1, "#111827");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, c.width, c.height);

  // 추상적인 원 몇 개 (갤러리 포스터 느낌)
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 5; i++) {
    const r = 80 + Math.random() * 140;
    const x = 200 + Math.random() * 600;
    const y = 150 + Math.random() * 250;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#f9fafb";
  ctx.font = "bold 70px system-ui, -apple-system, 'Noto Sans KR'";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(title, c.width / 2, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

// ==============================
// 액자 만들기 (사이즈 랜덤, 벽에 걸린 느낌)
// ==============================
function createFrameOnWall({ wallX, zAlong, height, width, color, title, href }) {
  const group = new THREE.Group();

  // 포스터
  const tex = createPosterTexture(color, title);
  const picGeo = new THREE.PlaneGeometry(width, height);
  const picMat = new THREE.MeshStandardMaterial({
    map: tex,
    roughness: 0.4,
    metalness: 0.3
  });
  const picture = new THREE.Mesh(picGeo, picMat);
  picture.position.z = 0.21;
  picture.castShadow = true;

  // 액자 테두리
  const frameGeo = new THREE.BoxGeometry(width + 0.3, height + 0.3, 0.5);
  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x050816,
    roughness: 0.4,
    metalness: 0.7
  });
  const frame = new THREE.Mesh(frameGeo, frameMat);
  frame.castShadow = true;

  // 액자를 천장에서 매다는 얇은 막대 (hanger)
  const hangerGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.2, 8);
  const hangerMat = new THREE.MeshStandardMaterial({
    color: 0x9ca3af,
    metalness: 0.8,
    roughness: 0.3
  });
  const hanger = new THREE.Mesh(hangerGeo, hangerMat);
  hanger.position.y = height / 2 + 0.8;
  hanger.position.z = -0.05;

  group.add(frame);
  group.add(picture);
  group.add(hanger);

  // 그룹 위치 + 회전 (벽 방향으로)
  group.position.set(wallX, 4, zAlong);
  group.rotation.y = wallX < 0 ? Math.PI / 2 : -Math.PI / 2;

  group.userData.href = href;
  group.userData.title = title;
  group.userData.type = "frame";

  // 각 액자 위에 스팟 라이트
  const spot = new THREE.SpotLight(0xffffff, 0.9, 30, Math.PI / 6, 0.4, 1);
  spot.position.set(wallX < 0 ? wallX - 2 : wallX + 2, 9, zAlong);
  spot.target = group;
  spot.castShadow = false;
  scene.add(spot);

  scene.add(group);
  return group;
}

// ==============================
// 색상 팔레트 (Bootstrap 컬러)
// ==============================
const COLORS = {
  red:    "#dc3545",
  orange: "#fd7e14",
  yellow: "#ffc107",
  green:  "#28a745",
  blue:   "#007bff",
  purple: "#6f42c1",
  cyan:   "#17a2b8",
  teal:   "#20c997",
  pink:   "#e83e8c",
  indigo: "#6610f2"
};

// ==============================
// Django URL 매핑
// ==============================
const URLS = {
  portfolio: "{% url 'portfolio_url' %}",
  admin: "/admin",
  finance: "{% url 'finance_home_url' %}",
  cost: "{% url 'costhome_url' %}",
  quality: "/quality/dashboard",
  security: "{% url 'sr_home_url' %}",
  lgsupport: "/lgsupport/video",

  medvqa: "/umass/med-vqa/",
  dsSystem: "/umass/datascience-system/",
  ml: "/umass/machine-learning/",
  ai: "/umass/artificial-intelligence/",
  rl: "/umass/reinforcement-learning/",
  docs: "https://github.com/EunbiYoon"
};

// ==============================
// 액자 배치 (B 스타일: 크기/간격 다 다르게)
// ==============================
const frames = [];

// 왼쪽: Software Engineering (벽 X = -14)
const seConfigs = [
  { z: -11, scale: 1.1, title: "Portfolio",          href: URLS.portfolio, color: COLORS.red },
  { z:  -7, scale: 0.9, title: "Database",           href: URLS.admin,     color: COLORS.orange },
  { z:  -3, scale: 1.3, title: "Finance Backend",    href: URLS.finance,   color: COLORS.green },
  { z:   1, scale: 0.85,title: "Cost Center",        href: URLS.cost,      color: COLORS.teal },
  { z:   5, scale: 1.15,title: "Quality Dashboard",  href: URLS.quality,   color: COLORS.blue },
  { z:   9, scale: 0.95,title: "Security & Reinvent",href: URLS.security,  color: COLORS.indigo },
  { z:  13, scale: 0.8, title: "LG Support Video",   href: URLS.lgsupport, color: COLORS.pink }
];

seConfigs.forEach(cfg => {
  const h = 2.2 * cfg.scale;
  const w = 3.6 * cfg.scale;
  const f = createFrameOnWall({
    wallX: -14,
    zAlong: cfg.z,
    height: h,
    width: w,
    color: cfg.color,
    title: cfg.title,
    href: cfg.href
  });
  frames.push(f);
});

// 오른쪽: Machine Learning (벽 X = 14)
const mlConfigs = [
  { z: -10, scale: 1.25,title: "Doctor AI Agent",  href: URLS.medvqa,  color: COLORS.purple },
  { z:  -6, scale: 0.9, title: "Systems for DS",   href: URLS.dsSystem,color: COLORS.cyan },
  { z:  -1.5,scale: 1.2, title: "Machine Learning",href: URLS.ml,      color: COLORS.blue },
  { z:   3, scale: 0.95,title: "Artificial Intelligence", href: URLS.ai,color: COLORS.yellow },
  { z:   7.5,scale: 1.1, title: "Reinforcement Learning", href: URLS.rl,color: COLORS.teal },
  { z:  12, scale: 0.85,title: "Docs & Code",      href: URLS.docs,    color: COLORS.indigo }
];

mlConfigs.forEach(cfg => {
  const h = 2.3 * cfg.scale;
  const w = 3.7 * cfg.scale;
  const f = createFrameOnWall({
    wallX: 14,
    zAlong: cfg.z,
    height: h,
    width: w,
    color: cfg.color,
    title: cfg.title,
    href: cfg.href
  });
  frames.push(f);
});

// ==============================
// Hover + Click (Raycaster)
// ==============================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

window.addEventListener("mousemove", (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener("click", () => {
  if (hovered && hovered.userData && hovered.userData.href) {
    window.location.href = hovered.userData.href;
  }
});

// ==============================
// 렌더 루프
// ==============================
function animate() {
  requestAnimationFrame(animate);

  // hover 체크: 각 group의 frame(Box)을 대상으로
  const targetMeshes = frames.map(f => f.children[0]); // children[0] = frame box
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(targetMeshes);

  if (intersects.length > 0) {
    const g = intersects[0].object.parent;
    if (hovered !== g) {
      if (hovered) hovered.scale.set(1, 1, 1);
      hovered = g;
      hovered.scale.set(1.08, 1.08, 1.08);
      document.body.style.cursor = "pointer";
    }
  } else {
    if (hovered) hovered.scale.set(1, 1, 1);
    hovered = null;
    document.body.style.cursor = "default";
  }

  renderer.render(scene, camera);
}
animate();

// ==============================
// 리사이즈
// ==============================
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
